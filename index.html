<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links úteis | Cultura Jurídica</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Clubes de leitura, Academia, newsletter e área do assinante do Cultura Jurídica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#fffbf7;
    --preto:#0d0d0f;
    --preto-hover:#26262b;
    --ouro:#ca9547;
    --ouro-hover:#b9853b;
    --ouro-claro:#fccb82;
    --largura:509px;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--fundo);font-family:"DM Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{width:min(var(--largura),100% - 32px);margin:0 auto;padding:43px 0 56px;display:flex;flex-direction:column;align-items:center}

  .logo{display:block;width:166px;height:64px;margin-bottom:52px}
  .logo img{display:block;width:100%;height:100%}

  /* Banner = fundo do Figma (sem botão) + botão recriado em CSS por cima, na mesma posição do Figma.
     O banner inteiro é o link; o hover em qualquer parte acende o botão. */
  .banners{width:100%;display:flex;flex-direction:column;gap:24px}
  .banner{display:block;position:relative;width:100%;aspect-ratio:3660/1500;border-radius:10px;overflow:hidden;background:#111;-webkit-tap-highlight-color:transparent}
  .banner > img{display:block;width:100%;height:100%;object-fit:cover}
  .banner::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
  .banner:focus-visible,.botao:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}

  /* Medidas do botão no Figma (frame 3660x1500): 1148 x 245,5; --x e --y = posição do canto */
  .cta{
    position:absolute;
    left:calc(var(--x) / 3660 * 100%);
    top:calc(var(--y) / 1500 * 100%);
    width:calc(1148 / 3660 * 100%);
    height:calc(245.46 / 1500 * 100%);
    border:1px solid var(--ouro-claro);
    border-radius:2.6% / 12.2%;
    background:linear-gradient(90deg,var(--ouro),var(--ouro-claro));
    overflow:hidden;
    z-index:1;
    transition:box-shadow .35s ease, filter .35s ease;
  }
  .cta .rotulo{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  /* brilho que passa por cima no hover */
  .cta::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);
    transform:translateX(-130%);
  }
  @media (hover:hover){
    .banner:hover .cta{box-shadow:0 0 0 1px rgba(252,203,130,.5),0 6px 22px rgba(252,203,130,.45);filter:brightness(1.08) saturate(1.08)}
    .banner:hover .cta::after{transform:translateX(130%);transition:transform .8s ease}
  }
  .banner:focus-visible .cta{box-shadow:0 0 0 1px rgba(252,203,130,.5),0 6px 22px rgba(252,203,130,.45)}
  .banner:active .cta{filter:brightness(.95)}

  /* Etiqueta no banner do Ágora */
  .tag{position:absolute;left:26.9%;top:11%;transform:translateX(-50%);white-space:nowrap;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:rgba(7,15,30,.72);border:1px solid rgba(252,203,130,.45);color:#faedcf;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .tag i{width:7px;height:7px;border-radius:50%;background:var(--ouro-claro);box-shadow:0 0 0 0 rgba(252,203,130,.6);animation:pulsa 2s ease-out infinite}
  @keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(252,203,130,.6)}70%,100%{box-shadow:0 0 0 7px rgba(252,203,130,0)}}

  /* Botões finais: mesma linguagem dos botões dos banners (brilho + contorno dourado no hover) */
  .botoes{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:24px}
  .botao{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;height:68px;padding:0 22px;border-radius:8px;background:var(--preto);color:#fff;font-size:17px;font-weight:700;text-decoration:none;border:1px solid rgba(252,203,130,.22);transition:background .25s ease,box-shadow .3s ease,border-color .3s ease}
  .botao .ico{flex:none;width:22px;height:22px;display:block;color:var(--ouro-claro)}
  .botao .txt{flex:1;text-align:center;padding-right:36px}
  .botao .seta{position:absolute;right:20px;top:50%;width:18px;height:18px;margin-top:-9px;opacity:.55;transition:opacity .25s ease,transform .3s ease}
  .botao::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-130%)}
  .botao.ouro{background:linear-gradient(90deg,var(--ouro),#e3b16a);border-color:var(--ouro-claro);text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .botao.ouro .ico{color:#fff}
  .botao.ouro::after{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%)}
  @media (hover:hover){
    .botao:hover{background:var(--preto-hover);border-color:rgba(252,203,130,.7);box-shadow:0 6px 18px rgba(0,0,0,.22)}
    .botao.ouro:hover{background:linear-gradient(90deg,var(--ouro),#e3b16a);filter:brightness(1.08) saturate(1.08);box-shadow:0 6px 22px rgba(252,203,130,.45)}
    .botao:hover::after{transform:translateX(130%);transition:transform .8s ease}
    .botao:hover .seta,.botao:focus-visible .seta{opacity:1;animation:corre 1.1s cubic-bezier(.45,0,.2,1) infinite}
  }
  /* seta sai pela direita e volta entrando pela esquerda, em loop enquanto o mouse está em cima */
  @keyframes corre{0%{transform:translateX(0);opacity:1}45%{transform:translateX(30px);opacity:0}46%{transform:translateX(-30px);opacity:0}100%{transform:translateX(0);opacity:1}}
  .botao:active{filter:brightness(.95)}

  /* Rodapé escuro, de ponta a ponta */
  .rodape{background:#070f1e;color:#e9e1d1;padding:52px 16px 48px;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
  .rodape .m{display:block;background:currentColor;-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
  .rodape .m-logo{--src:url(img/rodape-a.svg);width:84px;aspect-ratio:576/181;color:#f3ecdc}
  .rodape .m-lema{--src:url(img/rodape-b.svg);width:min(440px,100%);aspect-ratio:1535/46}
  .redes{display:flex;gap:18px;list-style:none;padding:0}
  .redes a{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#e9e1d1;transition:color .25s ease,background .25s ease}
  .redes a:hover{color:#070f1e;background:var(--ouro-claro)}
  .redes svg{width:20px;height:20px;display:block}
  .rodape a:focus-visible{outline:2px solid var(--ouro-claro);outline-offset:3px}

  @media (max-width:420px){
    main{padding-top:32px;padding-bottom:40px}
    .logo{margin-bottom:36px}
    .banners{gap:16px}
    .botao{height:60px;font-size:15px;padding:0 18px;gap:12px}
    .botao .txt{padding-right:30px}
    .tag{font-size:10px;padding:3px 8px 3px 7px}
    .rodape{padding:44px 16px 40px}
  }
  /* Notebook da Academia: duas metades da mesma imagem (tampa e base) cortadas na dobradiça */
  .nb{position:absolute;left:calc(2030 / 3660 * 100%);top:calc(159 / 1500 * 100%);width:calc(1630 / 3660 * 100%);height:calc(1341 / 1500 * 100%);pointer-events:none}
  .nb img{position:absolute;inset:0;width:100%;height:100%;display:block}
  .nb .base{clip-path:inset(57.6% 0 0 0)}
  .nb .tampa{position:absolute;inset:0;clip-path:inset(0 0 42.4% 0);transform-origin:50% 57.6%}
  /* Tela do notebook: as 3 fileiras de professores correm em loop (direita, esquerda, direita) */
  .tela{position:absolute;left:calc(103 / 1630 * 100%);top:calc(29 / 1341 * 100%);width:calc(1197 / 1630 * 100%);height:calc(715 / 1341 * 100%);overflow:hidden}
  .fila{position:relative;display:block;width:100%;overflow:hidden}
  .fila.f1{height:34.55%}.fila.f2{height:37.62%}.fila.f3{height:27.83%}
  .pista{position:absolute;left:0;top:0;height:100%;width:285.6%;background-repeat:repeat-x;background-size:33.3333% 100%;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite}
  .f1 .pista{background-image:url(img/fila-1.webp?v=3);animation:vai-dir 26s linear infinite 1.2s}
  .f2 .pista{background-image:url(img/fila-2.webp?v=3);animation:vai-esq 22s linear infinite 1.2s}
  .f3 .pista{background-image:url(img/fila-3.webp?v=3);animation:vai-dir 30s linear infinite 1.2s}
  @keyframes vai-dir{from{transform:translateX(-33.3333%)}to{transform:translateX(0)}}
  @keyframes vai-esq{from{transform:translateX(0)}to{transform:translateX(-33.3333%)}}
  .js .pista{animation-play-state:paused}
  .js .visto .pista{animation-play-state:running}

  /* Entrada ao rolar (só com JS; sem JS tudo aparece normal) */
  .js .banner{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  .js .banner.visto{opacity:1;transform:none}
  .js .botoes .botao{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1),background .25s ease,box-shadow .3s ease,border-color .3s ease}
  .js .botoes.visto .botao{opacity:1;transform:none}
  .js .botoes.visto .botao:nth-child(2){transition-delay:.08s,.08s,0s,0s,0s}
  .js .botoes.visto .botao:nth-child(3){transition-delay:.16s,.16s,0s,0s,0s}

  /* Notebook abrindo: a tampa gira em torno da dobradiça enquanto a tela acende */
  .js .nb .base{opacity:0;transform:translateY(18px);transition:opacity .6s ease .1s,transform .9s cubic-bezier(.2,.7,.2,1) .1s}
  .js .nb .tampa{opacity:0;transform:perspective(1100px) rotateX(-84deg);filter:brightness(.25);
    transition:transform 1.3s cubic-bezier(.22,.8,.2,1) .45s,opacity .3s ease .45s,filter 1.3s ease .45s}
  .js .visto .nb .base{opacity:1;transform:none}
  .js .visto .nb .tampa{opacity:1;transform:perspective(1100px) rotateX(0);filter:none}

  @media (prefers-reduced-motion:reduce){
    .cta,.cta::after,.botao,.botao::after,.redes a{transition:none}
    .tag i,.botao:hover .seta,.botao:focus-visible .seta,.pista{animation:none !important}
    .js .banner,.js .botoes .botao,.js .nb .base,.js .nb .tampa{opacity:1;transform:none;filter:none;transition:none}
  }
</style>
<script>document.documentElement.classList.add('js')</script>

<script>
  (function () {
    var alvos = document.querySelectorAll('.banner, .botoes');
    if (!('IntersectionObserver' in window)) {
      alvos.forEach(function (el) { el.classList.add('visto'); });
      return;
    }
    var io = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); }
      });
    }, { threshold: 0.35 });
    alvos.forEach(function (el) { io.observe(el); });
  })();
</script>
