<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links úteis | Cultura Jurídica</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Clubes de leitura, Academia, newsletter e área do assinante do Cultura Jurídica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#fffbf7;
    --preto:#0d0d0f;
    --preto-hover:#26262b;
    --ouro:#ca9547;
    --ouro-hover:#b9853b;
    --ouro-claro:#fccb82;
    --largura:509px;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--fundo);font-family:"DM Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{width:min(var(--largura),100% - 32px);margin:0 auto;padding:43px 0 56px;display:flex;flex-direction:column;align-items:center}

  .logo{display:block;width:166px;height:64px;margin-bottom:52px}
  .logo img{display:block;width:100%;height:100%}

  /* Banner = fundo do Figma (sem botão) + botão recriado em CSS por cima, na mesma posição do Figma.
     O banner inteiro é o link; o hover em qualquer parte acende o botão. */
  .banners{width:100%;display:flex;flex-direction:column;gap:24px}
  .banner{display:block;position:relative;width:100%;aspect-ratio:3660/1500;border-radius:10px;overflow:hidden;background:#111;-webkit-tap-highlight-color:transparent}
  .banner > img{display:block;width:100%;height:100%;object-fit:cover}
  .banner::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
  .banner:focus-visible,.botao:focus-visible{outline:3px solid var(--ouro);outline-offset:3px}

  /* Medidas do botão no Figma (frame 3660x1500): 1148 x 245,5; --x e --y = posição do canto */
  .cta{
    position:absolute;
    left:calc(var(--x) / 3660 * 100%);
    top:calc(var(--y) / 1500 * 100%);
    width:calc(1148 / 3660 * 100%);
    height:calc(245.46 / 1500 * 100%);
    border:1px solid var(--ouro-claro);
    border-radius:2.6% / 12.2%;
    background:linear-gradient(90deg,var(--ouro),var(--ouro-claro));
    overflow:hidden;
    z-index:1;
    transition:box-shadow .35s ease, filter .35s ease;
  }
  .cta .rotulo{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
  /* brilho que passa por cima no hover */
  .cta::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);
    transform:translateX(-130%);
  }
  @media (hover:hover){
    .banner:hover .cta{box-shadow:0 0 0 1px rgba(252,203,130,.5),0 6px 22px rgba(252,203,130,.45);filter:brightness(1.08) saturate(1.08)}
    .banner:hover .cta::after{transform:translateX(130%);transition:transform .8s ease}
  }
  .banner:focus-visible .cta{box-shadow:0 0 0 1px rgba(252,203,130,.5),0 6px 22px rgba(252,203,130,.45)}
  .banner:active .cta{filter:brightness(.95)}

  .botoes{width:100%;display:flex;flex-direction:column;gap:14px;margin-top:21px}
  .botao{display:flex;align-items:center;justify-content:center;height:76px;padding:0 20px;border-radius:4px;background:var(--preto);color:#fff;font-size:18px;font-weight:700;text-align:center;text-decoration:none;transition:background .25s ease,box-shadow .25s ease}
  .botao:hover{background:var(--preto-hover);box-shadow:0 0 0 1px rgba(252,203,130,.55)}
  .botao.ouro{background:var(--ouro)}
  .botao.ouro:hover{background:var(--ouro-hover);box-shadow:none}

  footer{margin-top:44px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px 28px}
  footer img{display:block;max-width:100%;height:auto}

  @media (max-width:420px){
    main{padding-top:32px}
    .logo{margin-bottom:36px}
    .banners{gap:16px}
    .botao{height:64px;font-size:16px}
  }
  /* Notebook da Academia: duas metades da mesma imagem (tampa e base) cortadas na dobradiça */
  .nb{position:absolute;left:calc(2030 / 3660 * 100%);top:calc(159 / 1500 * 100%);width:calc(1630 / 3660 * 100%);height:calc(1341 / 1500 * 100%);pointer-events:none}
  .nb img{position:absolute;inset:0;width:100%;height:100%;display:block}
  .nb .base{clip-path:inset(57.6% 0 0 0)}
  .nb .tampa{clip-path:inset(0 0 42.4% 0);transform-origin:50% 57.6%}

  /* Entrada ao rolar (só com JS; sem JS tudo aparece normal) */
  .js .banner{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
  .js .banner.visto{opacity:1;transform:none}
  .js .botoes .botao{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1),background .25s ease,box-shadow .25s ease}
  .js .botoes.visto .botao{opacity:1;transform:none}
  .js .botoes.visto .botao:nth-child(2){transition-delay:.08s,.08s,0s,0s}
  .js .botoes.visto .botao:nth-child(3){transition-delay:.16s,.16s,0s,0s}

  /* Notebook abrindo: a tampa gira em torno da dobradiça enquanto a tela acende */
  .js .nb .base{opacity:0;transform:translateY(18px);transition:opacity .6s ease .1s,transform .9s cubic-bezier(.2,.7,.2,1) .1s}
  .js .nb .tampa{opacity:0;transform:perspective(1100px) rotateX(-84deg);filter:brightness(.25);
    transition:transform 1.3s cubic-bezier(.22,.8,.2,1) .45s,opacity .3s ease .45s,filter 1.3s ease .45s}
  .js .visto .nb .base{opacity:1;transform:none}
  .js .visto .nb .tampa{opacity:1;transform:perspective(1100px) rotateX(0);filter:none}

  @media (prefers-reduced-motion:reduce){
    .cta,.cta::after,.botao{transition:none}
    .js .banner,.js .botoes .botao,.js .nb .base,.js .nb .tampa{opacity:1;transform:none;filter:none;transition:none}
  }
</style>
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<main>
  <a class="logo" href="https://www.culturajuridica.com.br/" aria-label="Cultura Jurídica"><img src="img/logo.svg" alt="Cultura Jurídica"></a>

    <a class="banner" href="https://lancamento.culturajuridica.com.br/penalistas" aria-label="Clube dos Penalistas com Cleber Masson. Fazer parte">
      <img src="img/penalistas.webp" alt="" width="1400" height="574" loading="lazy">

  </footer>
</main>
<script>
  (function () {
    var alvos = document.querySelectorAll('.banner, .botoes');
    if (!('IntersectionObserver' in window)) {
      alvos.forEach(function (el) { el.classList.add('visto'); });
      return;
    }
    var io = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); }
      });
    }, { threshold: 0.35 });
    alvos.forEach(function (el) { io.observe(el); });
  })();
</script>
</body>
</html>
